*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"ThmanyahSans","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  color:var(--ink);background:#e9a74a var(--bgimg) 30% center/cover no-repeat;
  user-select:none;-webkit-user-select:none;
}
.screen{position:fixed;inset:0;display:none;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top);overflow:hidden}
.screen.on{display:grid}
#home,#end{grid-template-rows:1fr auto}
.credit{
  text-align:center;font-size:clamp(10px,min(2.1vh,3.15vw),16px);font-weight:700;color:#fff;background:rgba(15,44,71,.95);
  padding:6px 8px;line-height:1.35;position:relative;z-index:3
}

/* ---------- buttons ---------- */
.big-btn{
  font:inherit;font-weight:800;font-size:clamp(18px,3.8vh,30px);color:#fff;border:0;cursor:pointer;
  background:linear-gradient(180deg,#f0924f,var(--clay-d));border-radius:18px;
  padding:.55em 1.7em;box-shadow:0 6px 0 #8a3f17,0 12px 22px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s;
  display:inline-flex;align-items:center;gap:.5em;white-space:nowrap;border:3px solid #ffd2b0
}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a3f17,0 6px 12px rgba(0,0,0,.3)}
.big-btn svg{width:1.1em;height:1.1em}

/* ---------- HOME ---------- */
#home .stage{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);justify-items:center;padding:clamp(10px,3vh,28px) 16px clamp(8px,2vh,20px);gap:clamp(4px,1.5vh,16px);min-height:0}
.title-box{
  text-align:center;max-width:min(94vw,640px);background:rgba(255,255,255,.9);border-radius:22px;
  padding:clamp(6px,1.6vh,16px) clamp(16px,4vw,40px);box-shadow:0 10px 28px rgba(0,0,0,.25)
}
.title-box h1,.end-card h2{font-family:"ThmanyahSerif","ThmanyahSans",serif}
.title-box h1{font-size:clamp(28px,7.6vh,66px);line-height:1.2;font-weight:800;color:var(--ink)}
.title-box h1 span{color:var(--clay-d)}
.title-box p{font-size:clamp(13px,2.6vh,21px);margin-top:2px;color:var(--sky-d);font-weight:700}
.scene{width:min(100%,900px);height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:clamp(6px,1.6vh,16px)}
.mascot{height:min(100%,42vh);flex:1 1 auto;min-height:0;animation:bob 4.4s ease-in-out infinite;transform-origin:50% 100%}
.mascot img{transform:scaleX(-1);height:100%;width:auto;max-width:100%;display:block;object-fit:contain;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}

/* ---------- PLAY ---------- */
#play .top{position:relative;z-index:2;padding:clamp(6px,1.6vh,14px) clamp(10px,3vw,24px) 0;display:grid;gap:clamp(4px,1vh,10px)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:.25em .8em;font-weight:800;font-size:clamp(13px,2.4vh,20px);box-shadow:0 3px 10px rgba(0,0,0,.2);direction:ltr;unicode-bidi:isolate}
.chip svg{width:1.25em;height:1.25em}
.chip b{font-variant-numeric:lining-nums;min-width:1.2em;text-align:center}
.sound{border:0;background:#fff;border-radius:50%;width:clamp(30px,5vh,42px);height:clamp(30px,5vh,42px);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.sound svg{width:60%;height:60%}
.track{position:relative;height:clamp(54px,11.5vh,92px);margin:0 clamp(4px,1.5vw,12px);background:rgba(255,255,255,.55);border-radius:999px;backdrop-filter:blur(2px)}
.track .line{position:absolute;right:clamp(30px,6vh,48px);left:clamp(34px,7vh,56px);bottom:20%;height:0;border-top:5px dotted rgba(141,122,98,.75)}
.track .done{position:absolute;right:clamp(30px,6vh,48px);bottom:calc(20% - 1px);height:7px;border-radius:6px;background:var(--clay);width:0;transition:width .9s ease}
.track .dots{position:absolute;right:clamp(30px,6vh,48px);left:clamp(34px,7vh,56px);bottom:calc(20% - 6px);display:flex;justify-content:space-between;pointer-events:none}
.track .dots u{width:12px;height:12px;border-radius:50%;background:var(--stone);border:3px solid var(--stone-d);display:block}
.track .dots u.hit{background:var(--clay);border-color:var(--clay-d)}
.track .tower{position:absolute;left:6px;bottom:8%;height:84%}
.track .walker{position:absolute;bottom:12%;height:82%;transition:right .9s ease;right:6px}
.track .walker img{height:100%;width:auto;display:block;pointer-events:none}
.track .tower svg{height:100%;width:auto;display:block}
.walker.walk{animation:step 1.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:clamp(6px,1.6vh,16px);padding:clamp(6px,1.6vh,14px) clamp(10px,3vw,28px) clamp(8px,2vh,18px);min-height:0}
.card{
  background:rgba(255,255,255,.96);border-radius:clamp(14px,3vh,26px);box-shadow:0 12px 32px rgba(0,0,0,.28);
  padding:clamp(10px,2.4vh,26px) clamp(12px,3vw,34px);display:grid;grid-template-rows:auto 1fr auto;gap:clamp(6px,1.4vh,14px);min-height:0;
  border-top:6px solid var(--sky)
}
.qnum{justify-self:start;font-size:clamp(12px,2.2vh,17px);font-weight:800;color:var(--sky-d);background:var(--sky-l);border-radius:999px;padding:.15em .8em;direction:ltr;unicode-bidi:isolate}
.qtext{display:grid;place-items:center;text-align:center;font-weight:800;font-size:clamp(20px,4.8vh,44px);line-height:1.5;padding:0 4px;min-height:0;overflow:hidden}
.qtext small{display:block;font-size:.55em;color:var(--sky-d);font-weight:700;margin-bottom:.3em}
.fb{min-height:clamp(40px,8.5vh,78px);display:grid;place-items:center;text-align:center;border-radius:14px;padding:6px 10px;font-weight:700;font-size:clamp(13px,2.7vh,22px);line-height:1.5;opacity:0;transform:translateY(6px);transition:.25s}
.fb.show{opacity:1;transform:none}
.fb.good{background:var(--sky-l);color:var(--sky-d)}
.fb.bad{background:var(--clay-l);color:var(--clay-d)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,18px)}
.ans{
  font:inherit;font-weight:800;font-size:clamp(15px,3.2vh,28px);border:0;cursor:pointer;color:#fff;border-radius:clamp(14px,2.6vh,22px);
  min-height:clamp(58px,13vh,110px);padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:.5em;line-height:1.3;
  transition:transform .15s, opacity .2s
}
.ans svg{width:1.4em;height:1.4em;flex:none}
.ans.yes{background:linear-gradient(180deg,#3d97e6,var(--sky-d));box-shadow:0 5px 0 #0c3f6e}
.ans.no{background:linear-gradient(180deg,#f0924f,var(--clay-d));box-shadow:0 5px 0 #8a3f17}
.ans:active{transform:translateY(3px)}
.ans.dim{opacity:.45;pointer-events:none}
.ans.pick{outline:4px solid var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:clamp(6px,1.4vh,12px);justify-content:center;align-content:center}
.wchip{font:inherit;font-weight:800;font-size:clamp(16px,3.4vh,28px);background:var(--sand);color:var(--ink);border:3px solid transparent;border-radius:14px;padding:.4em .9em;cursor:pointer;box-shadow:0 4px 0 var(--sand-d);transition:transform .15s}
.wchip:active{transform:translateY(2px)}
.wchip.used{opacity:.25;pointer-events:none}
.wchip.sel{background:var(--sky-l);border-color:var(--sky);box-shadow:0 4px 0 #9cc8ef}
.wchip.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:clamp(40px,7.5vh,64px);align-items:center;background:#f2f8fd;border:3px dashed #9cc8ef;border-radius:14px;padding:6px 10px;font-weight:800;font-size:clamp(16px,3.4vh,28px);color:var(--sky-d)}
.slots span{background:#fff;border-radius:10px;padding:.1em .6em;box-shadow:0 2px 6px rgba(0,0,0,.15);animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.tapzone{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;gap:clamp(6px,1.4vh,12px);min-height:0;width:100%}

/* ---------- END ---------- */
#end{background:#e9a74a var(--bgimg) 30% center/cover no-repeat}
#end .stage{position:relative;z-index:1;display:grid;place-items:center;padding:12px;min-height:0}
@media (min-aspect-ratio:4/3){#end .stage{justify-items:start;padding-inline:6vw}}
@media (max-aspect-ratio:3/4){body{background-position:80% 0}#end .stage{align-items:end}#end .end-art{display:none}#end{background-position:30% 0}}
.end-card{background:rgba(255,255,255,.96);border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:clamp(12px,3vh,32px) clamp(16px,4vw,44px);text-align:center;display:grid;gap:clamp(6px,1.6vh,16px);justify-items:center;max-width:min(92vw,640px);max-height:96%;border-top:6px solid var(--clay)}
.end-card h2{font-size:clamp(22px,5.2vh,44px)}
.end-card .val{background:var(--sky-l);color:var(--sky-d);border-radius:14px;padding:.4em 1em;font-weight:800;font-size:clamp(14px,2.8vh,22px);line-height:1.6}
.stars{display:flex;gap:8px;direction:ltr}
.stars svg{width:clamp(38px,8vh,70px);height:clamp(38px,8vh,70px)}
.stars svg.pop{animation:starin .5s both}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.end-art{height:clamp(60px,16vh,140px)}
.end-art svg{height:100%;width:auto}

@media (min-aspect-ratio:4/3){#home .scene{align-items:flex-start;padding-inline-start:9vw;width:100%;max-width:none}}
@media (min-width:600px) and (max-height:520px){
  .scene{flex-direction:row;align-items:center;justify-content:flex-start;gap:6vw}
  .mascot{height:min(100%,62vh);flex:0 0 auto}
  .title-box p{display:none}
}
@media (max-height:460px){
  .qtext{font-size:clamp(16px,6vh,28px)}
  .ans{min-height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section id="home" class="screen on">
  <div class="stage">
    <div class="title-box">
      <h1><span>الانتماء</span> والولاء للوطن</h1>
    </div>
    <div class="scene">
      <div class="mascot"><img class="girl" alt="" draggable="false" width="417" height="640"></div>
      <button class="big-btn" id="startBtn"><svg><use href="#i-play"/></svg>ابدأ الرحلة</button>
    </div>
  </div>
  <div class="credit">إعداد : أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي (١-٩)</div>
</section>

<section id="play" class="screen">
  <div class="top">
    <div class="hud">
      <span class="chip"><svg><use href="#i-gem"/></svg><b id="crates">0</b></span>
      <span class="chip"><b id="rn">1</b>/<b id="rt">12</b></span>
      <button class="sound" id="sndBtn" aria-label="الصوت"><svg viewBox="0 0 24 24"><use id="sndUse" href="#i-snd"/></svg></button>

      <div class="line"></div><div class="done" id="done"></div>

      <div class="tower"><svg viewBox="0 0 90 120"><use href="#i-tower"/></svg></div>
      <div class="walker walk" id="walker"><img class="girl" alt="" draggable="false" width="417" height="640"></div>
    </div>
  </div>
  <div class="main">

      <div class="qnum" id="qnum"></div>
      <div class="qtext" id="qtext"></div>
      <div class="fb" id="fb"></div>
    </div>
    <div id="controls"></div>
  </div>

</section>

      <div class="stars" id="stars"></div>
      <span class="chip"><svg><use href="#i-gem"/></svg><b id="fc">0</b>/<b id="ft">12</b></span>

        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type="sine";o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(.0001,t+i*dur);g.gain.exponentialRampToValueAtTime(.18,t+i*dur+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
        o.start(t+i*dur);o.stop(t+i*dur+dur+.02);
      });
    }catch(e){}
  }
  var sGood=function(){beep([523,659,784],.12)}, sBad=function(){beep([220,185],.16)}, sWin=function(){beep([523,659,784,1047],.15)};
  $("sndBtn").onclick=function(){soundOn=!soundOn;$("sndUse").setAttribute("href",soundOn?"#i-snd":"#i-mute")};

  var rounds,idx,gems,locked,timer;

  function buildTrack(){
    var d=$("dots");d.innerHTML="";
    for(var i=0;i<=TOTAL;i++){d.appendChild(document.createElement("u"))}
  }
  function updateTrack(){
    var p=idx/TOTAL;
    var track=$("track"),w=$("walker"),tw=track.querySelector(".tower");
    var tr=track.clientWidth, ww=w.clientWidth, twd=tw.clientWidth;
    var start=6, travel=Math.max(0,tr-ww-twd-start-16);
    var x=p*travel;
    w.style.right=(start+x)+"px";
    $("done").style.width=Math.max(0,x)+"px";
    var us=$("dots").children;
    for(var i=0;i<us.length;i++){us[i].classList.toggle("hit",i<=idx)}
  }
  function start(){
    var sit=shuffle(SITUATIONS).map(function(s){return {type:"sit",d:s}});
    rounds=sit.concat([{type:"def"},{type:"pick"}]);
    idx=0;gems=0;locked=false;
    $("crates").textContent="0";$("rt").textContent=TOTAL;
    buildTrack();show("play");
    requestAnimationFrame(function(){updateTrack();render()});
  }
  function setFb(msg,good){var f=$("fb");f.className="fb "+(good?"good":"bad")+" show";f.textContent=msg}
  function clearFb(){$("fb").className="fb";$("fb").textContent=""}

  function finishRound(good,msg){
    locked=true;
    if(good){gems++;$("crates").textContent=gems;sGood()}else{sBad()}
    setFb(msg,good);
    timer=setTimeout(function(){
      idx++;updateTrack();
      timer=setTimeout(function(){ if(idx>=TOTAL){end()}else{render()} },idx>=TOTAL?1000:700);
    },1900);
  }

  function btn(cls,html){var b=document.createElement("button");b.className=cls;b.innerHTML=html;return b}

  function render(){
    locked=false;clearFb();
    var r=rounds[idx];
    $("rn").textContent=idx+1;
    $("qnum").textContent=(idx+1)+" / "+TOTAL;
    var c=$("controls");c.innerHTML="";
    if(r.type==="sit"){
      $("qtext").innerHTML="<div><small>هل يعبّر هذا السلوك عن الانتماء والولاء للوطن؟</small>"+r.d.t+"</div>";
      c.className="answers";
      var yes=btn("ans yes",icon("i-check")+"يعبّر عن الانتماء");
      var no=btn("ans no",icon("i-cross")+"لا يعبّر عن الانتماء");
      yes.onclick=function(){answer(true,yes,[yes,no])};
      no.onclick=function(){answer(false,no,[yes,no])};
      c.appendChild(yes);c.appendChild(no);
    }else if(r.type==="def"){ defRound(c) }else{ pickRound(c) }
  }
  function answer(val,btnEl,all){
    if(locked)return;
    var r=rounds[idx].d, good=(val===r.ok);
    all.forEach(function(b){if(b!==btnEl)b.classList.add("dim")});
    btnEl.classList.add("pick");
    finishRound(good,(good?"أحسنت! ":"الإجابة الصحيحة: "+(r.ok?"يعبّر عن الانتماء. ":"لا يعبّر عن الانتماء. "))+r.why);
  }

  function defRound(c){
    c.className="";
    $("qtext").innerHTML="<div><small>اضغط الكلمات بالترتيب الصحيح</small>ما تعريف الانتماء والولاء للوطن؟</div>";
    var zone=document.createElement("div");zone.className="tapzone";
    var slots=document.createElement("div");slots.className="slots";slots.innerHTML="&nbsp;";
    var chips=document.createElement("div");chips.className="chips";
    zone.appendChild(slots);zone.appendChild(chips);c.appendChild(zone);
    var next=0,mistakes=0;
    shuffle(DEF.map(function(w,i){return {w:w,i:i}})).forEach(function(o){
      var b=btn("wchip",o.w);
      b.onclick=function(){
        if(locked||b.classList.contains("used"))return;
        if(o.i===next){
          if(next===0)slots.innerHTML="";
          var s=document.createElement("span");s.textContent=o.w;slots.appendChild(s);
          b.classList.add("used");next++;
          if(next===DEF.length){
            finishRound(mistakes===0,mistakes===0?"أحسنت! التعريف: شعور الفرد بالحب تجاه وطنه، فيعمل على خدمته وبنائه.":"اكتمل التعريف: شعور الفرد بالحب تجاه وطنه، فيعمل على خدمته وبنائه.");
          }
        }else{
          mistakes++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");sBad();
        }
      };
      chips.appendChild(b);
    });
  }

  function pickRound(c){
    c.className="";
    $("qtext").innerHTML="<div><small>اختر ثلاث جهات</small>ما الجهات التي يشملها الشعور بالانتماء والولاء؟</div>";
    var zone=document.createElement("div");zone.className="chips";
    c.appendChild(zone);
    var sel=[];
    shuffle(PICK.opts).forEach(function(o){
      var b=btn("wchip",o);
      b.onclick=function(){
        if(locked)return;
        var k=sel.indexOf(o);
        if(k>-1){sel.splice(k,1);b.classList.remove("sel");return}
        if(sel.length>=3)return;
        sel.push(o);b.classList.add("sel");
        if(sel.length===3){
          var good=sel.every(function(x){return PICK.ok.indexOf(x)>-1});
          finishRound(good,good?"أحسنت! الوطن والسلطان وأفراد المجتمع.":"الجهات الصحيحة: الوطن والسلطان وأفراد المجتمع.");
        }
      };
      zone.appendChild(b);
    });
  }

  function end(){
    sWin();show("end");
    $("fc").textContent=gems;$("ft").textContent=TOTAL;
    var p=gems/TOTAL,n=p>=.85?3:(p>=.6?2:1);
    var s=$("stars");s.innerHTML="";
    for(var i=0;i<3;i++){
      var e=document.createElementNS("http://www.w3.org/2000/svg","svg");
      e.setAttribute("viewBox","0 0 24 24");
      var u=document.createElementNS("http://www.w3.org/2000/svg","use");
      u.setAttribute("href",i<n?"#i-star":"#i-star-off");e.appendChild(u);
      if(i<n){e.classList.add("pop");e.style.animationDelay=(i*.25)+"s"}
      s.appendChild(e);
    }
  }

  $("startBtn").onclick=start;
  $("againBtn").onclick=function(){clearTimeout(timer);start()};
  window.addEventListener("resize",function(){if($("play").classList.contains("on"))updateTrack()});
})();
</script>
</body>
</html>
